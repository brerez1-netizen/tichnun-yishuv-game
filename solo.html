<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>תכנון יישוב - תרגול אישי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f0d5b7;
    --espresso: #321a10;
    --espresso-light: #4f2b1b;
    --academy: #35465a;
    --good: #3ecf6e;
    --bad: #e05252;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Rubik', sans-serif; background: var(--espresso); color: var(--cream); }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-weight: 900; font-size: 1.5rem; margin: 0 0 4px; text-align: center; }
  .subtitle { text-align: center; color: #d8c0a8; font-size: 0.88rem; margin: 0 0 20px; line-height: 1.5; }

  .card { background: var(--espresso-light); border: 2px solid #6b4530; border-radius: 16px; padding: 18px; margin-bottom: 16px; }

  .legend-group { margin-bottom: 10px; }
  .legend-group-title { font-size: 0.75rem; color: #c9ae8d; font-weight: 700; margin-bottom: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .legend .chip { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; padding: 5px 10px; border-radius: 20px; background: rgba(255,255,255,0.06); }
  .legend .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; flex-shrink: 0; }
  .legend .swatch.line { width: 20px; height: 4px; border-radius: 2px; }
  .legend .swatch.dashed { background-image: repeating-linear-gradient(90deg, #5da36f 0 4px, transparent 4px 8px); background-color: transparent !important; height: 4px; }

  .board-wrap { overflow-x: auto; }
  svg#board { width: 100%; height: auto; display: block; }

  .plot { cursor: pointer; stroke: #2b190f; stroke-width: 1.5; }
  .plot.empty { fill: url(#emptyHatch); }
  .plot.selected { stroke: var(--cream); stroke-width: 3.5; }
  .plot.violation { stroke: var(--bad); stroke-width: 4; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { stroke-width: 4; } 50% { stroke-width: 6; } }
  .footprint { fill: rgba(0,0,0,0.32); pointer-events: none; }
  .street-line { fill: none; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; }
  .street-line.selected { filter: drop-shadow(0 0 3px var(--cream)); }
  .street-hit { fill: none; stroke: transparent; stroke-linecap: round; cursor: pointer; pointer-events: stroke; }
  .park { fill: #4f9f63; opacity: 0.85; stroke: #386e46; stroke-width: 1.5; }

  .panel-title { font-weight: 900; margin: 0 0 10px; font-size: 1.05rem; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .lu-btn { border: 2px solid transparent; border-radius: 10px; padding: 10px 14px; font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
  .lu-btn.active { border-color: var(--cream); }
  .lu-btn.erase { background: transparent; border: 2px dashed #d8c0a8; color: #d8c0a8; }
  .lu-btn.add-custom { background: transparent; border: 2px dashed #6b4530; color: #d8c0a8; }

  .bl-row { display: flex; gap: 8px; margin-top: 14px; }
  .bl-row button { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #6b4530; background: transparent; color: var(--cream); font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
  .bl-row button.active { background: var(--academy); border-color: var(--academy); }

  .street-toggle { display: flex; gap: 8px; }
  .street-toggle button { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #6b4530; background: transparent; color: var(--cream); font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
  .street-toggle button.active { background: var(--academy); border-color: var(--academy); }

  .custom-form { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .custom-form input[type="text"] { flex: 1; min-width: 120px; padding: 8px 10px; border-radius: 8px; border: 2px solid #6b4530; font-family: inherit; }
  .custom-form input[type="color"] { width: 40px; height: 36px; border: none; border-radius: 8px; padding: 0; background: none; }

  .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  button.action { font-family: inherit; font-weight: 700; font-size: 1rem; border: none; border-radius: 12px; padding: 13px 28px; cursor: pointer; background: linear-gradient(135deg, var(--cream), #d8b98e); color: var(--espresso); }
  button.ghost { background: transparent; border: 2px solid #d8c0a8; color: #d8c0a8; }

  .result-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
  .result-row.ok { background: rgba(62,207,110,0.12); }
  .result-row.bad { background: rgba(224,82,82,0.14); }
  .result-icon { font-size: 1.3rem; }
  .result-title { font-weight: 900; margin-bottom: 2px; }
  .result-msg { font-size: 0.9rem; color: #e8dcca; }

  .empty-note { color: #d8c0a8; font-size: 0.85rem; text-align: center; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏘️ תכנון יישוב</h1>
  <p class="subtitle">רשת רחובות ומגרשים בהשראת תשריט אמיתי - לא מייצג מקום ספציפי. סמנו ייעודי קרקע וקווי בניין על המגרשים, קבעו את סוג כל רחוב, ובדקו את התכנון.</p>

  <div class="card">
    <div class="legend-group">
      <div class="legend-group-title">ייעודי קרקע</div>
      <div class="legend" id="legendLandUses"></div>
    </div>
    <div class="legend-group">
      <div class="legend-group-title">סוגי רחוב</div>
      <div class="legend" id="legendStreets"></div>
    </div>
  </div>

  <div class="card board-wrap">
    <svg id="board" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="emptyHatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#4a3120"></rect>
          <line x1="0" y1="0" x2="0" y2="10" stroke="#5c3d27" stroke-width="4"></line>
        </pattern>
      </defs>
      <g id="parkLayer"></g>
      <g id="plotsLayer"></g>
      <g id="footprintsLayer"></g>
      <g id="streetsLayer"></g>
    </svg>
  </div>

  <div class="card" id="detailPanel">
    <p class="empty-note">לחצו על מגרש או רחוב במפה כדי לערוך אותו.</p>
  </div>

  <div class="controls">
    <button class="action" onclick="evaluate()">✅ בדקו תכנון</button>
    <button class="action ghost" onclick="if(confirm('לאפס את כל התכנון?')) resetPlan();">איפוס</button>
  </div>

  <div class="card" id="resultsPanel" style="display:none;"></div>
</div>

<script src="js/gameData.js"></script>
<script>
const STORAGE_KEY = 'tichnunYishuvPlan_v2';
const gd = window.gameData;

let plots = gd.generatePlots();
let streetOverrides = {};
let customLandUses = [];
let selected = null; // { kind: 'plot'|'street', id }

function allLandUses() { return gd.BASE_LAND_USES.concat(customLandUses); }
function luByKey(key) { return allLandUses().find((l) => l.key === key); }
function plotById(id) { return plots.find((p) => p.id === id); }
function streetById(id) { return gd.STREETS.find((s) => s.id === id); }

function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.customLandUses) customLandUses = saved.customLandUses;
    if (saved.plots) {
      plots.forEach((p) => {
        if (saved.plots[p.id]) Object.assign(p, saved.plots[p.id]);
      });
    }
    if (saved.streetOverrides) streetOverrides = saved.streetOverrides;
  } catch (e) { /* התעלמות מנתונים פגומים */ }
}

function save() {
  const plotsData = {};
  plots.forEach((p) => { plotsData[p.id] = { landUse: p.landUse, buildingLine: p.buildingLine }; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ plots: plotsData, streetOverrides, customLandUses }));
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function renderLegend() {
  const luBar = document.getElementById('legendLandUses');
  luBar.innerHTML = '';
  allLandUses().forEach((l) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="swatch" style="background:${l.color}"></span>${l.label}`;
    luBar.appendChild(chip);
  });

  const stBar = document.getElementById('legendStreets');
  stBar.innerHTML = gd.STREET_TYPES.map((s) =>
    `<div class="chip"><span class="swatch line ${s.dashed ? 'dashed' : ''}" style="${s.dashed ? '' : 'background:' + s.color}"></span>${s.label}</div>`
  ).join('') + '<div class="chip"><span class="swatch" style="background:#4f9f63"></span>שצ"פ קיים (כיכר)</div>';
}

function renderStreets() {
  const layer = document.getElementById('streetsLayer');
  layer.innerHTML = '';
  gd.STREETS.forEach((s) => {
    const type = gd.streetTypeOf(s.id, streetOverrides);
    const def = gd.STREET_TYPES.find((t) => t.key === type);
    const d = 'M ' + s.points.map((p) => `${p.x},${p.y}`).join(' L ');
    const visible = svgEl('path', {
      d, class: 'street-line' + (selected && selected.kind === 'street' && selected.id === s.id ? ' selected' : ''),
      stroke: def.color, 'stroke-width': def.width,
    });
    if (def.dashed) visible.setAttribute('stroke-dasharray', '10,8');
    visible.dataset.id = s.id;
    const hit = svgEl('path', { d, class: 'street-hit', 'stroke-width': Math.max(def.width, 24) });
    hit.dataset.id = s.id;
    hit.onclick = () => selectItem('street', s.id);
    layer.appendChild(visible);
    layer.appendChild(hit);
  });
}

function renderPark() {
  const layer = document.getElementById('parkLayer');
  layer.innerHTML = '';
  gd.PARK_POLYGONS.forEach((poly) => {
    layer.appendChild(svgEl('polygon', { points: poly.map((p) => `${p.x},${p.y}`).join(' '), class: 'park' }));
  });
}

function renderPlots(violatingIds) {
  const layer = document.getElementById('plotsLayer');
  const fpLayer = document.getElementById('footprintsLayer');
  layer.innerHTML = '';
  fpLayer.innerHTML = '';
  plots.forEach((p) => {
    const cls = ['plot'];
    if (!p.landUse) cls.push('empty');
    if (selected && selected.kind === 'plot' && selected.id === p.id) cls.push('selected');
    if (violatingIds && violatingIds.has(p.id)) cls.push('violation');
    const el = svgEl('polygon', { points: p.points.map((pt) => `${pt.x},${pt.y}`).join(' '), class: cls.join(' ') });
    if (p.landUse) el.setAttribute('fill', luByKey(p.landUse).color);
    el.dataset.id = p.id;
    el.onclick = () => selectItem('plot', p.id);
    layer.appendChild(el);

    const footprint = gd.buildingFootprint(p, streetOverrides);
    if (footprint) {
      fpLayer.appendChild(svgEl('polygon', { points: footprint.map((pt) => `${pt.x},${pt.y}`).join(' '), class: 'footprint' }));
    }
  });
}

function renderBoard(violatingIds) {
  renderStreets();
  renderPark();
  renderPlots(violatingIds);
}

function selectItem(kind, id) {
  selected = { kind, id };
  renderBoard();
  renderDetailPanel();
}

function renderDetailPanel() {
  const panel = document.getElementById('detailPanel');
  if (!selected) {
    panel.innerHTML = '<p class="empty-note">לחצו על מגרש או רחוב במפה כדי לערוך אותו.</p>';
    return;
  }
  if (selected.kind === 'street') {
    const s = streetById(selected.id);
    const currentType = gd.streetTypeOf(s.id, streetOverrides);
    panel.innerHTML = '<p class="panel-title">סוג הרחוב</p><div class="street-toggle" id="streetTypeButtons"></div>';
    const box = document.getElementById('streetTypeButtons');
    gd.STREET_TYPES.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = t.key === currentType ? 'active' : '';
      btn.innerText = t.label;
      btn.onclick = () => setStreetType(s.id, t.key);
      box.appendChild(btn);
    });
    return;
  }

  const p = plotById(selected.id);
  panel.innerHTML = `
    <p class="panel-title">ייעוד המגרש</p>
    <div class="btn-group" id="luButtons"></div>
    <div id="customForm" style="display:none;" class="custom-form">
      <input type="text" id="customLabel" placeholder="שם הייעוד" maxlength="24" />
      <input type="color" id="customColor" value="#c46fd6" />
      <button class="lu-btn" onclick="addCustomLandUse()">הוספה</button>
    </div>
    <div id="buildingLineSection"></div>
  `;
  const luButtons = document.getElementById('luButtons');
  allLandUses().forEach((l) => {
    const btn = document.createElement('button');
    btn.className = 'lu-btn' + (p.landUse === l.key ? ' active' : '');
    btn.style.background = l.color;
    btn.style.color = l.textColor;
    btn.innerText = l.label;
    btn.onclick = () => setLandUse(l.key);
    luButtons.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'lu-btn add-custom';
  addBtn.innerText = '+ הוספת ייעוד';
  addBtn.onclick = () => { document.getElementById('customForm').style.display = 'flex'; };
  luButtons.appendChild(addBtn);
  const eraseBtn = document.createElement('button');
  eraseBtn.className = 'lu-btn erase';
  eraseBtn.innerText = 'נקה מגרש';
  eraseBtn.onclick = () => setLandUse(null);
  luButtons.appendChild(eraseBtn);

  const blSection = document.getElementById('buildingLineSection');
  if (p.landUse) {
    blSection.innerHTML = '<p class="panel-title" style="margin-top:16px;">קו בניין</p><div class="bl-row" id="blButtons"></div>';
    const blBox = document.getElementById('blButtons');
    Object.values(gd.BUILDING_LINE_PRESETS).forEach((preset) => {
      const btn = document.createElement('button');
      btn.className = p.buildingLine === preset.key ? 'active' : '';
      btn.innerText = preset.label;
      btn.onclick = () => setBuildingLine(preset.key);
      blBox.appendChild(btn);
    });
  }
}

function setLandUse(key) {
  const p = plotById(selected.id);
  p.landUse = key;
  if (key && !p.buildingLine) p.buildingLine = 'urban';
  if (!key) p.buildingLine = null;
  save();
  renderBoard();
  renderDetailPanel();
}

function setBuildingLine(key) {
  const p = plotById(selected.id);
  p.buildingLine = key;
  save();
  renderBoard();
  renderDetailPanel();
}

function setStreetType(streetId, type) {
  streetOverrides[streetId] = type;
  save();
  renderBoard();
  renderDetailPanel();
}

function addCustomLandUse() {
  const label = document.getElementById('customLabel').value.trim();
  const color = document.getElementById('customColor').value;
  if (!label) return;
  const key = 'custom-' + label.replace(/\s+/g, '-') + '-' + Date.now();
  customLandUses.push({ key, label, color, textColor: '#fff' });
  document.getElementById('customForm').style.display = 'none';
  document.getElementById('customLabel').value = '';
  save();
  renderLegend();
  setLandUse(key);
}

function resetPlan() {
  localStorage.removeItem(STORAGE_KEY);
  plots = gd.generatePlots();
  streetOverrides = {};
  customLandUses = [];
  selected = null;
  document.getElementById('resultsPanel').style.display = 'none';
  renderLegend();
  renderBoard();
  renderDetailPanel();
}

function evaluate() {
  const results = gd.RULES.map((rule) => rule.check(plots, streetOverrides));
  const violatingIds = new Set(results.flatMap((r) => r.violatingIds));
  renderBoard(violatingIds);

  const panel = document.getElementById('resultsPanel');
  panel.style.display = 'block';
  const unassigned = plots.filter((p) => !p.landUse).length;
  panel.innerHTML =
    '<p class="panel-title">תוצאות הבדיקה</p>' +
    gd.RULES.map((rule, i) => {
      const r = results[i];
      return `<div class="result-row ${r.ok ? 'ok' : 'bad'}">
        <div class="result-icon">${r.ok ? '✅' : '⚠️'}</div>
        <div><div class="result-title">${rule.title}</div><div class="result-msg">${r.message}</div></div>
      </div>`;
    }).join('') +
    (unassigned > 0 ? `<p class="empty-note">עדיין נותרו ${unassigned} מגרשים ריקים ללא ייעוד.</p>` : '');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

loadSaved();
renderLegend();
renderBoard();
renderDetailPanel();
</script>
</body>
</html>
